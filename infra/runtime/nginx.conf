# Local demonstration defaults; tune against measured bank traffic before production.
limit_req_zone $binary_remote_addr zone=seal_api_rate:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=seal_api_connections:10m;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 210m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location /api/ {
        limit_req zone=seal_api_rate burst=100 nodelay;
        limit_conn seal_api_connections 16;
        limit_req_status 429;
        limit_conn_status 429;
        error_page 429 = @rate_limited;
        set $backend backend:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    location @rate_limited {
        default_type application/json;
        return 429 '{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试","requestId":"$request_id","data":null}';
    }
    location ~ ^/(doc\.html|swagger-resources|v2/api-docs|v3/api-docs|webjars|swagger-ui) {
        set $backend backend:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
